name: Engine

on:
  push:
    branches: [main]
    paths:
      - engine/**
      - deploy/build_engine.sh
      - deploy/smoke/**
      - .github/workflows/engine.yml
  pull_request:
    paths:
      - engine/**
      - deploy/build_engine.sh
      - deploy/smoke/**
      - .github/workflows/engine.yml

permissions:
  contents: read

concurrency:
  group: engine-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install engine build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          autoconf automake build-essential libtool libxml2-dev
          libzthread-dev pkg-config
      - name: Build patched dedicated server
        env:
          TRONNER_BUILD_JOBS: "2"
          TRONNER_ENGINE_SOURCE_DIR: ${{ runner.temp }}/engine-source
          TRONNER_ENGINE_BUILD_DIR: ${{ runner.temp }}/engine-build
          TRONNER_ENGINE_PREFIX: ${{ runner.temp }}/armagetronad
        run: ./deploy/build_engine.sh
      - name: Test actual cycle hold and release
        env:
          TRONNER_ENGINE_SOURCE_DIR: ${{ runner.temp }}/engine-source
          TRONNER_ENGINE_BUILD_DIR: ${{ runner.temp }}/engine-build
          TRONNER_ENGINE_DATA_DIR: ${{ runner.temp }}/armagetronad/share/games/armagetronad-dedicated
        run: |
          ./deploy/smoke/build_probes.sh
          cd "$RUNNER_TEMP"
          "$TRONNER_ENGINE_BUILD_DIR/tronner-smoke-probes/start_cycle_test"
      - name: Upload test binary
        uses: actions/upload-artifact@v7
        with:
          name: armagetronad-dedicated-${{ github.sha }}
          path: ${{ runner.temp }}/armagetronad/bin/armagetronad-dedicated
          if-no-files-found: error
          retention-days: 7
