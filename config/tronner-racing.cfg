# Event and command bridge consumed by the external controller.
LADDERLOG_ENABLED 1
LADDERLOG_GAME_TIME_INTERVAL 1
LADDERLOG_WRITE_COMMAND 1
LADDERLOG_WRITE_CHAT 1
LADDERLOG_WRITE_PLAYER_ACTIVITY 1
LADDERLOG_WRITE_CURRENT_MAP 1
LADDERLOG_WRITE_CYCLE_CREATED 1
LADDERLOG_WRITE_CYCLE_DESTROYED 1
LADDERLOG_WRITE_CYCLE_RELEASED 1
LADDERLOG_WRITE_CYCLE_REPLAY_BEGIN 1
LADDERLOG_WRITE_CYCLE_REPLAY_STATE 1
LADDERLOG_WRITE_CYCLE_REPLAY_INPUT 1
LADDERLOG_WRITE_CYCLE_REPLAY_END 1
LADDERLOG_WRITE_CYCLE_REPLAY_SETTINGS 1
LADDERLOG_WRITE_RACE_FINISH_PATH 0
LADDERLOG_WRITE_ONLINE_PLAYER 1
LADDERLOG_WRITE_WINZONE_PLAYER_ENTER 1
LADDERLOG_WRITE_PLAYER_ENTERED_GRID 1
LADDERLOG_WRITE_PLAYER_ENTERED_SPECTATOR 1
LADDERLOG_WRITE_PLAYER_LEFT 1
LADDERLOG_WRITE_PLAYER_RENAMED 1
LADDERLOG_WRITE_PLAYER_COLORED_NAME 1
LADDERLOG_WRITE_ROUND_STARTED 1
LADDERLOG_WRITE_ROUND_FINISHED 1
LADDERLOG_WRITE_ROUND_ENDED 1
LADDERLOG_WRITE_NEW_ROUND 1

INTERCEPT_COMMANDS /q /rate /results /ghost /extend /skip /forceskip /end /nextmap /exclusion_list /leaderboard /cp /restart /respawn /sui /spec /spectate /join /setspawn /start /practice /report /suggest /help /size /reloadmaps /reload_controller /resetalltimes /reset /message /merge_users /tip /review /exclude /remove_exclusion /link
INTERCEPT_UNKNOWN_COMMANDS 1
LEGACY_LADDERLOG_COMMAND 0

# Private, short-lived replay plans shared with the game process.
GHOST_PLAN_DIRECTORY /var/lib/armagetronad/ghosts

WINZONE_PLAYER_ENTER_WIN 0
RACE_POINTS_TYPE 0
SCORE_RACE_FINISH 0
RESPAWN_TIME -1
RESPAWN_MESSAGE 0
SUICIDE_MESSAGE 0
RESPAWN_STRICT 0
PRACTICE_DEATHZONE_PROTECTION_TIME 1.0
# Allow a full-depth grind immediately after turning into a wall. Ordinary
# rubber and the baseline wall separation remain enabled.
CYCLE_RUBBER_MINDISTANCE_UNPREPARED 0
GAME_SP_HUMANS -1
GAME_RESTART_ON_PLAYER_CHANGE 0
ALLOW_TEAM_CHANGE 1
TEAMS_MAX 64
GAME_EMPTY_ROUND_END_DELAY 3
GAME_EXTERNAL_ROUND_CONTROL 1
# Keep one native arena participant while the server is empty.
# The filler AI is removed automatically as soon as a human joins.
AUTO_AIS 0
MIN_PLAYERS 1
NUM_AIS 0
SPAWN_WINGMEN_BACK 0
SPAWN_WINGMEN_SIDE 0
SPAWN_ALTERNATE 0
